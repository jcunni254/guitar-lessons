name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# No token permissions by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      pages: write # publish to Pages
      id-token: write # OIDC token deploy-pages exchanges with Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions are pinned to full commit SHAs, not tags: a tag can be
      # repointed at different code, a SHA cannot. Each SHA was resolved
      # from its repository's own tag ref and is recorded with the release
      # it corresponds to. Bump deliberately, never automatically.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The CSP pins the inline script by hash. If the script was edited
      # without updating the hash the embed would silently stop loading in
      # production, so fail the deploy instead.
      - name: Verify the CSP script hash matches the inline script
        run: python3 tools/csp-hash.py --check

      # Publish only the site itself. archive/, docs/ and tools/ stay in the
      # repo but are never served.
      - name: Assemble the published site
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp index.html _site/404.html
          cp -r assets/fonts _site/assets/fonts

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
